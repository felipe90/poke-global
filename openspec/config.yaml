# SDD configuration — generated by sdd-init (2026-08-15)
schema: spec-driven

context: |
  Project: poke-global — Front End technical assessment (Vue.js) for Global66: favorite
  Pokémon list consuming https://pokeapi.co/.
  Stack: Vue 3.5 (Composition API, <script setup>), TypeScript 6, Vite 8, Pinia 4,
  Vue Router, Vitest 4 + Vue Test Utils, Playwright, ESLint + oxlint + Prettier.
  Node v24.13.1 (engines: ^22.18.0 || >=24.12.0).
  Conventions: tests in src/__tests__/*.spec.ts; Pinia setup stores in src/stores/;
  @ alias -> src/ (vite.config.ts); e2e specs in e2e/ (playwright.config.ts).

testing:
  strict_tdd: true
  detected: 2026-08-15
  test_command: "npm run test:unit -- --run"
  unit:
    command: "npm run test:unit -- --run"
    framework: vitest (jsdom) + @vue/test-utils
    status: VERIFIED (executed; 1 file / 1 test passed)
  e2e:
    command: "npm run test:e2e"
    framework: playwright (@playwright/test; chromium/firefox/webkit)
    status: DECLARED in package.json, not executed (requires dev/preview server + browsers)
  type_check:
    command: "npm run type-check"
    framework: vue-tsc --build
    status: DECLARED in package.json; user reported passing
  lint:
    command: "npm run lint"
    framework: oxlint --fix + eslint --fix
    status: DECLARED in package.json, not executed here (scripts use --fix and would modify files)
  format:
    command: "npm run format"
    framework: prettier --write src/
    status: DECLARED in package.json
  coverage:
    available: false
    command: ""
    note: "@vitest/coverage-v8 is not installed - vitest --coverage would fail"

rules:
  proposal:
    - Include rollback plan for risky changes
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    guidelines:
      - Follow existing code patterns (Composition API, <script setup>, Pinia setup stores)
      - Tests live in src/__tests__/ (*.spec.ts); use vitest + @vue/test-utils
      - Never modify openspec/ artifacts in apply; only openspec/changes/{change}/tasks.md status marks
    tdd: true
    test_command: "npm run test:unit -- --run"
  verify:
    test_command: "npm run test:unit -- --run"
    build_command: "npm run type-check"
    e2e_command: "npm run test:e2e"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas

# Verification ledger (what sdd-init actually ran vs. declared-only)
verification:
  test_command_executed: true
  test_command_result: "npm run test:unit -- --run -> 1 file, 1 test passed (vitest 4.1.10)"
  type_check_executed: false
  lint_executed: false
  e2e_executed: false
  pending:
    - Run `npm run type-check` to confirm (user reported passing)
    - Run `npm run test:e2e` once with dev server (browsers must be installed)
    - Install @vitest/coverage-v8 if coverage gates are ever required
